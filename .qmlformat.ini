# qmlformat settings for the QML under src/app/qml and the builtin extension
# panels. The style mirrors the QML Coding Conventions.
#
# NormalizeOrder reorders each object's attributes into the canonical order
# (id, property declarations, signal declarations, signal handlers, functions,
# property bindings, then child objects) and sorts within each group. It is the
# "normalize" pass Qt Creator applies, and it is deterministic and idempotent,
# which the qml_format_check suite relies on. group-attributes-together was
# rejected: it only reorders the groups and keeps the author's order inside
# them, so it is not a canonical, stable target for a CI comparison.
#
# MaxColumnWidth wraps bindings at 100 columns. The tool default (-1) collapses
# the hand-wrapped ternary bindings this codebase uses into single ~300-column
# lines, which is unreadable.
#
# NewlineType is pinned to LF (matching .clang-format's LineEnding: LF) so the
# formatter is byte-stable across platforms.

[General]
NormalizeOrder=true
MaxColumnWidth=100
NewlineType=unix
