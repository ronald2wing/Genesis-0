# Whitelist of the C++-injected context properties so qmllint's
# UnqualifiedAccess warning does not fire for them. The authoritative list is
# the setContextProperty() calls in src/app/AppShell.cpp (14 core controllers
# plus the four AI controllers captions/cutout/enhance/tts). `titleGallery`
# was removed and must not be re-added.
#
# The value is a quoted, comma-separated list. The quotes are required: QSettings
# reads the quoted value as a single literal string, and qmllint splits it on
# commas. An unquoted `a,b` is taken as one identifier and the whitelist stops
# working.

[General]
disableUnqualifiedAccess = "controller,timelineModel,edit,exporter,mediaBin,keyframes,effectParams,scopes,extensions,captions,cutout,enhance,tts,settings,updates,gpu,project,i18n"
