# The builtin export extension: the studio shell's render form (preset, size,
# rate, output path, progress) surfaced as an inspector panel. There is no
# `entry` (no shared library): the panel is pure QML and reaches the host
# through the `extensions.call` bridge, so the extension is data + UI only. The
# panel is a bare file name beside this manifest, as the parser requires.

[extension]
id = "genesis.export"
name = "Genesis Export"
version = 1
api = 1

[[panel]]
label = "Export"
qml = "ExportPanel.qml"
