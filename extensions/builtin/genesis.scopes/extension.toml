# The builtin scopes extension: the studio shell's scope pane (histogram,
# waveform, vectorscope, parade) surfaced as an inspector panel. There is no `entry`
# (no shared library): the panel is pure QML and reaches the host through the
# `extensions.call` bridge, so the extension is data + UI only. The panel is a
# bare file name beside this manifest, as the parser requires.

[extension]
id = "genesis.scopes"
name = "Genesis Scopes"
version = 1
api = 1

[[panel]]
label = "Scopes"
qml = "ScopesPanel.qml"
