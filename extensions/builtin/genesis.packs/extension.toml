# The builtin data-only extension that ships the official effect-pack set.
# There is no `entry`: the extension contributes only its bundled packs (the
# 123 effect blocks below), whose bodies live beside this manifest as
# `packs/genesis.*/effect.glsl`.

[extension]
id = "genesis.packs"
name = "Genesis Effect Packs"
version = 1
api = 1

[[effect]]
id = "genesis.ascii"
name = "ASCII"
kind = "effect"
category = "Stylize"
order = 45
description = "The picture re-drawn as a grid of glyph cells, each shaded by its brightness."
body = "packs/genesis.ascii/effect.glsl"

[effect.wgsl]
entry = "effect.glsl"

[[effect.param]]
key = "columns"
label = "Columns"
type = "int"
min = 8
max = 120
default = 64
step = 1

[[effect]]
id = "genesis.bleach-bypass"
name = "Bleach Bypass"
