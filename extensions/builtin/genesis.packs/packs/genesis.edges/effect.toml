#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.edges"
name = "Edges"
kind = "effect"
category = "Stylize"
order = 56
intensity = "strength"
aliases = ["edges"]
description = "Dark lines where the picture turns, everything else to white."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
