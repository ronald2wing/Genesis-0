format = 2

[effect]
id = "genesis.chromatic-aberration"
name = "Chromatic Aberration"
kind = "effect"
category = "Distort"
order = 57
intensity = "shift"
aliases = ["chromatic-aberration"]
description = "Red and blue pulled apart towards the edges, the colour fringing of a cheap lens."

[[param]]
key = "shift"
label = "Shift"
type = "int"
min = 1
max = 24
default = 4
step = 1
unit = "px"

[wgsl]
entry = "effect.glsl"
