#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.pillarbox"
name = "Pillarbox"
kind = "effect"
category = "Transform"
order = 65
intensity = "size"
description = "Black bars down the left and right, the narrow-screen frame."

[[param]]
key = "size"
label = "Bar size"
type = "int"
min = 0
max = 50
default = 12
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
