# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.vibrance"
name = "Vibrance"
kind = "filter"
category = "Color"
order = 32
intensity = "amount"
aliases = ["vibrance"]
description = "Richer colour where it is muted, without blowing out what is already strong."

[[param]]
key = "amount"
label = "Amount"
min = 0.1
max = 2
default = 0.7
step = 0.05

[wgsl]
entry = "effect.glsl"
