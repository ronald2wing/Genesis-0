#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.pencil-sketch"
name = "Pencil Sketch"
kind = "effect"
category = "Stylize"
order = 47
intensity = "strength"
aliases = ["pencil-sketch", "sketch", "graphite"]
description = "Graphite linework over a warm paper tone."

[[param]]
key = "radius"
label = "Radius"
type = "int"
min = 1
max = 10
default = 3
step = 1
unit = "px"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
