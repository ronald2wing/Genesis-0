#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.pixelate"
name = "Pixelate"
kind = "effect"
category = "Distort"
order = 50
intensity = "size"
aliases = ["pixelate"]
description = "Big square pixels."

[[param]]
key = "size"
label = "Size"
type = "int"
min = 2
max = 64
default = 16
step = 1
unit = "px"

[wgsl]
entry = "effect.glsl"
