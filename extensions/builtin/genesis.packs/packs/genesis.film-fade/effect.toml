#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.film-fade"
name = "Faded Film"
kind = "filter"
category = "Cinematic"
order = 52
intensity = "strength"
description = "Lifted blacks and a warm wash, a print left in the sun."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
