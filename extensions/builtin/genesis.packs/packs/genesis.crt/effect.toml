# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.crt"
name = "CRT"
kind = "effect"
category = "Stylize"
order = 52
intensity = "strength"
aliases = ["crt"]
description = "A curved tube: fringed colour, scanlines and dimmed corners."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
