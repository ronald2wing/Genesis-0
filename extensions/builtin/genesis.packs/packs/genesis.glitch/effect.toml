#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.glitch"
name = "Glitch"
kind = "effect"
category = "Distort"
order = 60
intensity = "strength"
aliases = ["glitch"]
description = "Red and blue torn apart and whole bands slid sideways, a corrupted feed."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
