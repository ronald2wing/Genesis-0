# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.color-balance"
name = "Colour Balance"
kind = "effect"
category = "Color"
order = 45
description = "Lift, gamma and gain: the shadows raised, the midtones bent and the whole picture scaled, as the colour wheels would."

[[param]]
key = "lift"
label = "Lift"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gamma"
label = "Gamma"
min = 0.1
max = 10
default = 1
step = 0.01
animate = true

[[param]]
key = "gain"
label = "Gain"
min = 0
max = 2
default = 1
step = 0.01
animate = true

[wgsl]
entry = "effect.glsl"
