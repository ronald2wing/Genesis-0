#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.solarize"
name = "Solarize"
kind = "filter"
category = "Color"
order = 16
intensity = "strength"
description = "Bright parts flipped to their negative, the photographic Sabattier effect."

[[param]]
key = "threshold"
label = "Threshold"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
