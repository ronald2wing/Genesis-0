#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.spotlight"
name = "Spotlight"
kind = "effect"
category = "Light"
order = 74
description = "The picture lit from one point, everything else falling away to black."

[[param]]
key = "center_x"
label = "Centre X"
min = 0
max = 1
default = 0.5
step = 0.01

[[param]]
key = "center_y"
label = "Centre Y"
min = 0
max = 1
default = 0.5
step = 0.01

[[param]]
key = "radius"
label = "Radius"
min = 5
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
