#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.levels"
name = "Levels"
kind = "effect"
category = "Color"
order = 46
description = "The picture remapped between chosen black and white points, bent by gamma."

[[param]]
key = "in_black"
label = "Black point"
min = 0
max = 1
default = 0
step = 0.01

[[param]]
key = "in_white"
label = "White point"
min = 0
max = 1
default = 1
step = 0.01

[[param]]
key = "gamma"
label = "Gamma"
min = 0.1
max = 10
default = 1
step = 0.01

[[param]]
key = "out_black"
label = "Output black"
min = 0
max = 1
default = 0
step = 0.01

[[param]]
key = "out_white"
label = "Output white"
min = 0
max = 1
default = 1
step = 0.01

[wgsl]
entry = "effect.glsl"
