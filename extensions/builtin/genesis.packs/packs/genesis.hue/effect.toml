#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.hue"
name = "Hue"
kind = "effect"
category = "Color"
order = 15
intensity = "degrees"
description = "Every hue turned, brightness held."

[[param]]
key = "degrees"
label = "Hue"
min = -180
max = 180
default = 0
step = 1
unit = "deg"
animate = true

[wgsl]
entry = "effect.glsl"
