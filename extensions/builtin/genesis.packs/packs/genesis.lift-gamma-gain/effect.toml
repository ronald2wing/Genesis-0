#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.lift-gamma-gain"
name = "Lift, Gamma, Gain"
kind = "filter"
category = "Color"
order = 47
intensity = "strength"
description = "The colourist's primary wheels as three sliders: the shadows lifted, the midtones bent by gamma and the whole picture scaled, mixed from full strength down to the untouched picture."

[[param]]
key = "lift"
label = "Lift"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gamma"
label = "Gamma"
min = 0.1
max = 10
default = 1
step = 0.01
animate = true

[[param]]
key = "gain"
label = "Gain"
min = 0
max = 2
default = 1
step = 0.01
animate = true

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
