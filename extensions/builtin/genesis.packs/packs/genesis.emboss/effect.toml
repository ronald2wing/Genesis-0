#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.emboss"
name = "Emboss"
kind = "effect"
category = "Stylize"
order = 53
intensity = "strength"
aliases = ["emboss"]
description = "The picture stamped into relief, lit from one corner."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
