#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.letterbox"
name = "Letterbox"
kind = "effect"
category = "Transform"
order = 64
intensity = "size"
description = "Black bars across the top and bottom, the wide-screen frame."

[[param]]
key = "size"
label = "Bar size"
type = "int"
min = 0
max = 50
default = 12
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
