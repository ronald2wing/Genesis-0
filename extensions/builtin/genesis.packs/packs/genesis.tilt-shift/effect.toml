#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.tilt-shift"
name = "Tilt Shift"
kind = "effect"
category = "Blur"
order = 24
description = "A miniature look: sharp along one band, soft everywhere else."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 50
default = 20
step = 1
unit = "px"

[[param]]
key = "focus_y"
label = "Focus"
min = 0
max = 1
default = 0.5
step = 0.01

[[param]]
key = "band"
label = "Band"
min = 0.02
max = 0.5
default = 0.15
step = 0.01

[wgsl]
entry = "effect.glsl"
