#
# Re-authored from Concat's concat-effects package `concat.glow`,
# SPDX-License-Identifier: GPL-3.0-or-later,
# SPDX-FileCopyrightText: 2026 Jareer and Concat contributors.
#
# The original drew the picture's light `across` then `down` (a Gaussian of
# sixteen of the layer's pixels, at a quarter of them) and screened it back by
# the amount. The two passes are folded into one 9x9 kernel over tex, so no
# second distinct input is needed. The body is effect.glsl beside this
# manifest; [wgsl].entry is documentation only.

format = 2

[effect]
id = "genesis.glow"
name = "Glow"
kind = "effect"
category = "Stylize"
order = 42
intensity = "amount"
description = "A soft bloom around the bright parts of the picture."

[[param]]
key = "amount"
label = "Amount"
min = 10
max = 100
default = 45
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
