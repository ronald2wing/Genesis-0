#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.scanlines"
name = "Scanlines"
kind = "effect"
category = "Stylize"
order = 51
intensity = "strength"
aliases = ["scanlines"]
description = "Dark horizontal lines, the raster of a television."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
