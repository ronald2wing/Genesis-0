# SPDX-FileCopyrightText: 2026 Genesis-0 contributors
#
# Re-authored from Concat's concat-effects package `concat.zoom-blur`,
# SPDX-License-Identifier: GPL-3.0-or-later,
# SPDX-FileCopyrightText: 2026 Jareer and Concat contributors.
#
# The original drew three passes of sixteen scales (`fine` into `middle` into
# `effect`), each averaging the scales between two of the next one's. Those
# intermediates are not expressible on the single-texture path, so the scales
# are averaged straight from tex in one loop - no second distinct input
# needed. The body is effect.glsl beside this manifest; [wgsl].entry is
# documentation only.

format = 2

[effect]
id = "genesis.zoom-blur"
name = "Zoom Blur"
kind = "effect"
category = "Blur"
order = 23
intensity = "amount"
description = "A rush towards a point, as if the lens zoomed during the shot."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[[param]]
key = "x"
label = "Centre X"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "y"
label = "Centre Y"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
