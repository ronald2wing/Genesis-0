#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.lens-distortion"
name = "Lens Distortion"
kind = "effect"
category = "Distort"
order = 51
intensity = "distortion"
aliases = ["lens-distortion", "barrel", "pincushion"]
description = "Bends the picture like a wide lens: barrel one way, pincushion the other."

[[param]]
key = "distortion"
label = "Distortion"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
