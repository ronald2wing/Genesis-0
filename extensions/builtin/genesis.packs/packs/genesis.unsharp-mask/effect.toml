#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.unsharp-mask"
name = "Unsharp Mask"
kind = "effect"
category = "Basic"
order = 14
intensity = "amount"
description = "Crisper edges by the classic method: the original plus a share of the difference between it and a blurred copy, over a chosen radius."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 2
default = 0.5
step = 0.05

[[param]]
key = "radius"
label = "Radius"
min = 1
max = 10
default = 2
step = 1
unit = "px"

[wgsl]
entry = "effect.glsl"
