# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.film-grain"
name = "Film Grain"
kind = "effect"
category = "Stylize"
order = 50
intensity = "amount"
aliases = ["film-grain"]
description = "Dancing grain, the texture of film stock."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
