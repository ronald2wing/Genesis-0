#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.oil-paint"
name = "Oil Paint"
kind = "effect"
category = "Stylize"
order = 57
description = "Thick, edge-preserving smears, a dabbed-on oil painting."

[[param]]
key = "radius"
label = "Radius"
min = 1
max = 20
default = 6
step = 1
unit = "px"

[[param]]
key = "sharpness"
label = "Sharpness"
min = 1
max = 50
default = 12
step = 1

[wgsl]
entry = "effect.glsl"
