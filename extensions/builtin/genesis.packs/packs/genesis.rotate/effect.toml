#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.rotate"
name = "Rotate"
kind = "effect"
category = "Transform"
order = 63
description = "The picture turned a quarter, half or three-quarters of the way around."

[[param]]
key = "mode"
label = "Mode"
type = "enum"
min = 0
max = 2
default = 0
step = 1
values = [0, 1, 2]
labels = ["90\u00b0", "180\u00b0", "270\u00b0"]

[wgsl]
entry = "effect.glsl"
