# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.grayscale"
name = "Grayscale"
kind = "filter"
category = "Black & White"
order = 60
intensity = "strength"
description = "Black and white, mixed from full colour down to none."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
