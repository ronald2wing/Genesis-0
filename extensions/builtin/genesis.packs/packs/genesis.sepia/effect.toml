#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.sepia"
name = "Sepia"
kind = "filter"
category = "Retro"
order = 40
intensity = "strength"
description = "A warm brown print, mixed from full colour down to none."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
