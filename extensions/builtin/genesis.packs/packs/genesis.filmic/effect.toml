#
# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.filmic"
name = "Filmic"
kind = "filter"
category = "Color"
order = 20
intensity = "strength"
description = "A gentle film-like S-curve with a rolled-off toe and shoulder, mixed from full strength down to the untouched picture."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.glsl"
