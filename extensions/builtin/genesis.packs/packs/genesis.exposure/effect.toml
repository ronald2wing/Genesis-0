# The body is effect.glsl beside this manifest; [wgsl].entry is documentation
# only and is not consulted on the GLSL execution path.

format = 2

[effect]
id = "genesis.exposure"
name = "Exposure"
kind = "effect"
category = "Color"
order = 10
intensity = "stops"
description = "Brighter or darker by stops of light, as the lens would make it."

[[param]]
key = "stops"
label = "Exposure"
min = -4
max = 4
default = 0
step = 0.05
unit = "EV"
animate = true

[wgsl]
entry = "effect.glsl"
