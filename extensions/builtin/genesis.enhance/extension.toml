# The builtin enhance extension: the studio shell's upscale/denoise form (scale
# choice, consent, download, progress, cancel) surfaced as an inspector panel.
# There is no `entry` (no shared library): the panel is pure QML and reaches the
# host through the `extensions.call` bridge, so the extension is data + UI only.
# The panel is a bare file name beside this manifest, as the parser requires.

[extension]
id = "genesis.enhance"
name = "Genesis Enhance"
version = 1
api = 1

[[panel]]
label = "Enhance"
qml = "EnhancePanel.qml"
