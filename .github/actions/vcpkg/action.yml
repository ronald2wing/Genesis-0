name: Setup vcpkg
description: Bootstrap vcpkg and restore the binary cache used by the manifest

runs:
  using: composite
  steps:
    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/vcpkg-cache"
        git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
